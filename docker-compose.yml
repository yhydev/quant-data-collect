version: '3.8'

services:
  proxy:
    image: ${PROXY_IMAGE:-nadoo/glider}
    ports:
    - "${PROXY_PORT:-1080}:1080"
    command: -listen :1080 -forward ${FORWARD_SERVER}
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    container_name: arbitrage-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-arbitrage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: ${ADMINER_IMAGE:-adminer:4}
    container_name: arbitrage-adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arbitrage-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-arbitrage}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-false}
      - BINANCE_AUTH_HTTP_PROXY=${BINANCE_AUTH_HTTP_PROXY:-}
      - COLLECTOR_TYPE=${COLLECTOR_TYPE:-mock}
      - TRADER_TYPE=${TRADER_TYPE:-mock}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arbitrage-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://backend:8000}

volumes:
  postgres_data:
